name = "hybrid-audio-relay"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Shared secret that clients send as ?tok=. Set it once with:
#   npx wrangler secret put TEAM_TOKEN
# (If unset, the relay accepts any token.)

[vars]
MAX_MINUTES_PER_DAY = "240"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# SQLite-backed Durable Objects are required on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
